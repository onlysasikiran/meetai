name: MeetAI Phase 3 checkpoints
on:
  workflow_dispatch:
  push:
    branches: [phase-3-benchmark]
    paths: [.github/workflows/phase3.yml]
permissions:
  contents: read
concurrency:
  group: meetai-phase3-recovery
  cancel-in-progress: false
env:
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "6"
  TOKENIZERS_PARALLELISM: "false"
jobs:
  pending:
    if: github.ref == 'refs/heads/phase-3-benchmark'
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.queue.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - id: queue
        run: echo "batches=$(python3 -m bench.phase3_checkpoint --pending)" >> "$GITHUB_OUTPUT"

  prepare:
    needs: pending
    if: needs.pending.outputs.batches != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            .work/wheels
            .assets/models
          key: phase3-portable-ubuntu24-py312-v1-${{ hashFiles('requirements.lock', 'configs/assets.json', 'configs/meetai-assets.json') }}
      - if: steps.models.outputs.cache-hit != 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DGGML_OPENMP=ON -DLLAMA_CURL=OFF"
        run: |
          python -m pip wheel --no-binary=llama-cpp-python -r requirements.lock -w .work/wheels
          for attempt in 1 2 3; do
            python scripts/assets.py --group models && break
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 8
          done

  measure:
    needs: [pending, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        batch: ${{ fromJSON(needs.pending.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            .work/wheels
            .assets/models
          key: phase3-portable-ubuntu24-py312-v1-${{ hashFiles('requirements.lock', 'configs/assets.json', 'configs/meetai-assets.json') }}
          fail-on-cache-miss: true
      - name: Install pinned wheels
        run: python -m pip install --no-index --find-links=.work/wheels -r requirements.lock
      - name: Hydrate official source files
        if: "!startsWith(matrix.batch, 'size-')"
        run: |
          for attempt in 1 2 3; do
            python scripts/assets.py --group raw && break
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 8
          done
      - name: Run and checkpoint a matched batch
        env:
          MEETAI_BATCH: ${{ matrix.batch }}
        run: python -m bench.phase3_checkpoint --batch "$MEETAI_BATCH"
      - name: Retain batch if Git publication is briefly unavailable
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ matrix.batch }}
          path: results/phase3/checkpoints/${{ matrix.batch }}
          retention-days: 30
      - name: Publish only this batch to the benchmark branch
        env:
          MEETAI_BATCH: ${{ matrix.batch }}
        run: bash scripts/publish_phase3_batch.sh
